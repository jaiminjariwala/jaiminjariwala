<svg fill="none" viewBox="0 0 690 40" width="690" height="40" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        strong {
          font-family: "Comic Sans", "Comic Sans MS", Chalkboard, ChalkboardSE-Regular, "Marker Felt", Purisa, "URW Chancery L", cursive, sans-serif;
          color: limegreen;
          font-size: 1.5em;
        }
        .blink { animation: blink-animation 1s steps(5, start) infinite; }
        @keyframes blink-animation { to { visibility: hidden; } }
        @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
      </style>
      <strong>My Name is Jaimin and I like <span class="blink">Go, TypeScript and Python</span></strong>
    </div>
  </foreignObject>
</svg>
