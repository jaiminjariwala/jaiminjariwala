<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 380 50"
  width="380"
  height="50"
  role="img"
  aria-labelledby="title"
>
  <title id="title">Guestbook (Add a new entry)</title>
  <style>
    .pulse {
      transform-origin: 190px 25px;
      animation: pulse 3s linear infinite;
    }

    text {
      font-family:
        "Comic Sans MS", Chalkboard, "Marker Felt", cursive, sans-serif;
      font-size: 20.8px;
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(0.6);
      }
      50% {
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse {
        animation: none;
      }
    }
  </style>
  <g class="pulse">
    <text x="190" y="32" text-anchor="middle">
      <tspan font-weight="bold">
        <tspan fill="red">G</tspan>
        <tspan fill="orange">u</tspan>
        <tspan fill="yellow">e</tspan>
        <tspan fill="green">s</tspan>
        <tspan fill="blue">t</tspan>
        <tspan fill="violet">b</tspan>
        <tspan fill="purple">o</tspan>
        <tspan fill="pink">o</tspan>
        <tspan fill="red">k</tspan>
      </tspan>
      <tspan fill="#539bf5" text-decoration="underline">
        (Add a new entry)
      </tspan>
    </text>
  </g>
</svg>
