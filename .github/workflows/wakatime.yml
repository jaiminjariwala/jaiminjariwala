name: Update all-time coding stats
on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * *'
permissions:
  contents: write
concurrency:
  group: profile-readme
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check tracking credentials are configured
        id: configured
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          if [ -n "$WAKATIME_API_KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Add the WAKATIME_API_KEY repository secret to enable all-time stats.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Update language hours and percentage bars
        if: steps.configured.outputs.ready == 'true'
        uses: athul/waka-readme@370590ad8da8f54282ed92aa42b7c25ecbd5a9a6
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TIME_RANGE: all_time
          LANG_COUNT: '100'
          SHOW_TIME: 'true'
          SHOW_TOTAL: 'true'
          SHOW_TITLE: 'false'
          BLOCKS: '⬜🟨🟩'
          CODE_LANG: text
          TARGET_BRANCH: main
          TARGET_PATH: README.md
          COMMIT_MESSAGE: Update all-time coding hours by language
