name: Update commit activity
on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * *'
permissions:
  contents: write
concurrency:
  group: profile-readme
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Test statistics generators
        run: |
          node .github/scripts/commit-activity.cjs --test
          python3 .github/scripts/language-lines.py --test
      - name: Refresh commit activity and source line counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/commit-activity.cjs --publish
