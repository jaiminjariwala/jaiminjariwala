name: Update profile guestbook
on:
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: profile-guestbook
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.number == 1 && !github.event.issue.pull_request)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Refresh the latest five guestbook entries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/guestbook.cjs
